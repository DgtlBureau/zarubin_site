# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Bright-byte site to Pages

on:
  push:
    branches: ['main']
    paths:
      - 'src/playbook/insights/**/*.md'
      - 'src/playbook/insights/**/*.mdx'
      - 'src/playbook/expertise/**/*.md'
      - 'src/playbook/expertise/**/*.mdx'
      - 'src/cases/**.md'
      - 'src/cases/**.mdx'
      - 'src/products/**.md'
      - 'src/products/**.mdx'
      - 'src/team/**.md'
      - 'src/team/**.mdx'
      - 'package.json'
      - 'yarn.lock'
      - '**/*.ts'
      - '**/*.js'
      - '**/*.tsx'
      - '**/*.*'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate .env file
        run: |
          cat .env.example | envsubst > .env
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      # No `static_site_generator: next`: its config injection forces
      # `images.unoptimized: true`, which disables the srcset image loader.
      # `output: 'export'` is set in next.config.mjs via NEXT_OUTPUT_EXPORT
      # (basePath is empty on the custom domain, so nothing else is lost).
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      # Static export + resized WebP variants for next/image srcset (into out/_img)
      - name: Build with Next.js
        run: npm run build:export
      - name: Generate redirect stubs
        run: npm run generate-redirect-stubs
      - name: Generate sitemap
        run: npm run generate-sitemap
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Ping IndexNow with sitemap URLs
        # Non-blocking: a failed ping must not mark the deploy as failed
        continue-on-error: true
        run: sleep 60 && node scripts/indexnow.mjs
